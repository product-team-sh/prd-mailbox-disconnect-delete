<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mailbox disconnect/delete – prototype</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#ffffff; --bg-secondary:#F9FAFB; --bg-tertiary:#F3F4F6;
  --border:#E5E7EB; --border-strong:#D1D5DB;
  --ink:#111827; --ink-secondary:#374151; --ink-tertiary:#6B7280; --ink-quiet:#9CA3AF;
  --primary:#1D4ED8; --primary-hover:#1E40AF; --primary-tint:#EFF6FF; --primary-tint-border:#BFDBFE;
  --radius-md:8px; --radius-lg:12px;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg-tertiary);color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--primary)}

.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;
  padding:14px 24px;background:#fff;border-bottom:1px solid var(--border)}
.topbar-title{font-size:14px;font-weight:700}
.topbar-back{font-size:12.5px;color:var(--ink-tertiary);text-decoration:none}
.topbar-back:hover{color:var(--primary)}
.spacer{flex:1}
.counter{font-size:12px;color:var(--ink-tertiary);font-family:ui-monospace,monospace}

.stage{display:flex;flex-direction:column;align-items:center;padding:40px 20px 24px}
.frame{width:100%;max-width:900px;background:#fff;border:1px solid var(--border);
  border-radius:var(--radius-lg);box-shadow:0 1px 3px rgba(17,24,39,.06);overflow:hidden}
.frame img{width:100%;display:block}
.frame-cap{max-width:900px;width:100%;margin-top:14px;font-size:13px;color:var(--ink-secondary);
  line-height:1.55;text-align:center}
.frame-cap b{color:var(--ink)}

.nav{display:flex;align-items:center;gap:16px;padding:8px 20px 48px}
.nav-btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 18px;
  border-radius:8px;border:1px solid var(--border-strong);background:#fff;color:var(--ink);
  font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.nav-btn:hover{background:var(--bg-secondary)}
.nav-btn:disabled{opacity:.35;cursor:not-allowed}
.nav-btn:disabled:hover{background:#fff}
.nav-btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.nav-btn.primary:hover{background:var(--primary-hover)}

.dots{display:flex;gap:8px;padding-bottom:28px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--border-strong);border:none;
  cursor:pointer;padding:0}
.dot.active{background:var(--primary);width:22px;border-radius:5px;transition:width .15s}

.thumbrail{display:flex;gap:10px;overflow-x:auto;padding:0 20px 40px;max-width:1000px;margin:0 auto}
.thumb{flex-shrink:0;width:120px;border-radius:8px;border:2px solid transparent;
  overflow:hidden;cursor:pointer;background:#fff;box-shadow:0 1px 2px rgba(17,24,39,.08)}
.thumb.active{border-color:var(--primary)}
.thumb img{width:100%;display:block}
.thumb-label{font-size:10px;color:var(--ink-tertiary);text-align:center;padding:4px 2px 6px;
  font-weight:600;line-height:1.3}
.thumb.active .thumb-label{color:var(--primary-hover)}

kbd{font-family:ui-monospace,monospace;font-size:11px;background:var(--bg-secondary);
  border:1px solid var(--border);border-radius:4px;padding:1px 5px}
</style>
</head>
<body>

<div class="topbar">
  <a class="topbar-back" href="../">&larr; PRD</a>
  <span class="topbar-title">Mailbox disconnect/delete – prototype</span>
  <span class="spacer"></span>
  <span class="counter" id="counter">1 / 7</span>
</div>

<div class="stage">
  <div class="frame"><img id="frame-img" src="" alt=""></div>
  <p class="frame-cap" id="frame-cap"></p>
</div>

<div class="nav">
  <button class="nav-btn" id="prev-btn">&larr; Prev</button>
  <button class="nav-btn primary" id="next-btn">Next &rarr;</button>
</div>
<div class="dots" id="dots"></div>

<div class="thumbrail" id="thumbrail"></div>

<script>
var SCREENS = [
  { file: "kebab.png", label: "1 · Entry – kebab menu",
    cap: "<b>Email Accounts row, kebab menu open.</b> Delete is grouped and colored apart from the routine items." },
  { file: "loading.png", label: "2 · Loading",
    cap: "<b>Live impact fetch.</b> No instant skip past this – never a cached count." },
  { file: "impact-partial.png", label: "3a · Impact, partial",
    cap: "<b>Disconnect, partial reduction.</b> Every affected sequence still has another sender – amber, reversible badge." },
  { file: "impact-sole.png", label: "3b · Impact, mixed",
    cap: "<b>Delete, mixed severity.</b> Sole-sender sequences sort first, red, in-thread warning inline – permanent badge, red confirm." },
  { file: "no-impact.png", label: "4 · No impact",
    cap: "<b>Zero active sequences.</b> Plain confirm, no typed gate – the only single-click state." },
  { file: "blocked.png", label: "5 · Blocked",
    cap: "<b>Fetch failed.</b> Blocked, not skipped – no path from here to a completed removal." },
  { file: "success.png", label: "6 · Success",
    cap: "<b>Confirmed.</b> States what actually happened, not a generic \"done.\"" }
];

var idx = 0;
var img = document.getElementById("frame-img");
var cap = document.getElementById("frame-cap");
var counter = document.getElementById("counter");
var prevBtn = document.getElementById("prev-btn");
var nextBtn = document.getElementById("next-btn");
var dotsEl = document.getElementById("dots");
var thumbEl = document.getElementById("thumbrail");

function render(){
  var s = SCREENS[idx];
  img.src = "./screens/" + s.file;
  img.alt = s.label;
  cap.innerHTML = s.cap;
  counter.textContent = (idx+1) + " / " + SCREENS.length;
  prevBtn.disabled = idx === 0;
  nextBtn.textContent = idx === SCREENS.length - 1 ? "Restart ↻" : "Next →";
  Array.from(dotsEl.children).forEach(function(d, i){ d.classList.toggle("active", i === idx); });
  Array.from(thumbEl.children).forEach(function(t, i){ t.classList.toggle("active", i === idx); });
}

SCREENS.forEach(function(s, i){
  var dot = document.createElement("button");
  dot.className = "dot";
  dot.title = s.label;
  dot.onclick = function(){ idx = i; render(); };
  dotsEl.appendChild(dot);

  var thumb = document.createElement("div");
  thumb.className = "thumb";
  thumb.onclick = function(){ idx = i; render(); };
  var timg = document.createElement("img");
  timg.src = "./screens/" + s.file;
  timg.alt = s.label;
  var tlabel = document.createElement("div");
  tlabel.className = "thumb-label";
  tlabel.textContent = s.label;
  thumb.appendChild(timg);
  thumb.appendChild(tlabel);
  thumbEl.appendChild(thumb);
});

prevBtn.onclick = function(){ if (idx > 0) { idx--; render(); } };
nextBtn.onclick = function(){ idx = (idx + 1) % SCREENS.length; render(); };
document.addEventListener("keydown", function(e){
  if (e.key === "ArrowRight") nextBtn.click();
  if (e.key === "ArrowLeft") prevBtn.click();
});

render();
</script>
</body>
</html>
